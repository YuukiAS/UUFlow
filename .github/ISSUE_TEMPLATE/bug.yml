name: 问题反馈
description: Snug 运行出错、表现与预期不符
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先查看 README 的 [使用方式](https://github.com/zephyr4123/snug#-使用方式) 与 [已知限制](https://github.com/zephyr4123/snug#-已知限制)，使用上的疑问可发在 [讨论区](https://github.com/zephyr4123/snug/discussions/categories/q-a)。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么，期望是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 在设置「屏幕」页添加……
        2. 用 UU远程 连接后……
        3. 出现……
  - type: input
    id: snug-version
    attributes:
      label: Snug 版本
      description: 菜单栏「关于 Snug」
      placeholder: 2.7.4
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac 机型与 macOS 版本
      placeholder: MacBook Air M2 · macOS 15.5
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: 控制端设备
      description: 型号与系统；Snug 中选定的型号不同时一并写明
      placeholder: iPhone 16 Pro · iOS 26.1
    validations:
      required: true
  - type: input
    id: uu-version
    attributes:
      label: UU远程 版本
      description: Mac 端与控制端
  - type: textarea
    id: displays
    attributes:
      label: 显示器与相关软件
      description: 外接显示器、镜像、BetterDisplay 等显示器工具，没有可不填
  - type: textarea
    id: log
    attributes:
      label: 日志与截图
      description: |
        日志位于 `~/Library/Logs/Snug.log`，在访达中按 ⇧⌘G 粘贴此路径即可找到，拖入此框上传；上传前可自行查看内容。
        问题发生后尽快导出，并附上发生的大致时间。
