name: 功能建议
description: 新功能或现有功能的改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Snug 仅开发 macOS 版，并专注于 UU远程。Windows 版见 [社区移植](https://github.com/zephyr4123/snug#-社区移植)；安卓手机、iPhone 只需安装 UU远程 即可作为控制端，无需另装 Snug。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 在什么场景下、遇到了什么不便
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 期望的做法
  - type: textarea
    id: workaround
    attributes:
      label: 目前的替代办法
